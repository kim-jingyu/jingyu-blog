name: Upload to S3 for EC2 Deployment

on:
  push:
    branches: [main]

jobs:
  upload-and-trigger:
    runs-on: ubuntu-latest

    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_KEY: jingyu-blog-deploy.zip
      PROJECT_ROOT: jingyu-blog
      AWS_REGION: ap-northeast-2
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t $DOCKERHUB_USERNAME/backend ./backend
          docker push $DOCKERHUB_USERNAME/backend

      - name: Prepare .env and zip
        run: |
          mkdir $PROJECT_ROOT
          cp -r backend frontend docker-compose.yml $PROJECT_ROOT/
          echo "${{ secrets.ENV_BACKEND }}" > $PROJECT_ROOT/backend/.env
          echo "${{ secrets.ENV_FRONTEND }}" > $PROJECT_ROOT/frontend/.env
          zip -r $S3_KEY $PROJECT_ROOT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 cp $S3_KEY s3://$S3_BUCKET/$S3_KEY