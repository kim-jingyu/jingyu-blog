name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker Images and Deploy
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ubuntu
      ORACLE_KEY: ${{ secrets.ORACLE_KEY }}
      ENV_BACKEND: ${{ secrets.ENV_BACKEND }}
      ENV_FRONTEND: ${{ secrets.ENV_FRONTEND }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t $DOCKERHUB_USERNAME/backend ./backend
          docker push $DOCKERHUB_USERNAME/backend

      - name: Build and push frontend image
        run: |
          echo "${{ env.ENV_FRONTEND }}" > .env.frontend
          source .env.frontend
          
          docker build \
            --build-arg VITE_API_URL=${VITE_API_URL} \
            --build-arg VITE_APP_GOOGLE_CLIENT_ID=${VITE_APP_GOOGLE_CLIENT_ID} \
            --build-arg VITE_APP_KAKAO_CLIENT_ID=${VITE_APP_KAKAO_CLIENT_ID} \
            -t $DOCKERHUB_USERNAME/frontend ./frontend      
      
          docker push $DOCKERHUB_USERNAME/frontend

      - name: Deploy to ORACLE - docker-compose with ENV
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ env.ORACLE_KEY }}
          script: |
            cd /home/ubuntu/jingyu-blog
            git pull origin main
            docker compose down
            docker compose pull
            echo "${{ env.ENV_BACKEND }}" > ./backend/.env
            docker compose up -d
