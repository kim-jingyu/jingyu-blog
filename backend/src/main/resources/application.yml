spring:
  profiles:
    include: jwt, oauth2, aws, server

  datasource:
    url: jdbc:oracle:thin:@jingyulog_high?TNS_ADMIN=${ORACLE_TNS_PATH}
    username: admin
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    type: com.zaxxer.hikari.HikariDataSource

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

