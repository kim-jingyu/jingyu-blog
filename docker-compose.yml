version: '3'
services:
  backend:
    image: kimjingyu/backend:latest
    container_name: backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - ORACLE_TNS_PATH=/app/wallet
      - SPRING_DATA_REDIS_HOST=redis
    ports:
      - "8080:8080"
    volumes:
      - /home/ubuntu/oracle/Wallet_jingyulog:/app/wallet
    networks:
      - jingyu

  frontend:
    image: kimjingyu/frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - jingyu

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - jingyu

networks:
  jingyu:
