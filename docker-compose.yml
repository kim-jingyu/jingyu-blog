version: '3'
services:
  backend:
    image: kimjingyu/backend:latest
    container_name: backend
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - jingyu

  frontend:
    image: kimjingyu/frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - jingyu

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - jingyu

networks:
  jingyu:
